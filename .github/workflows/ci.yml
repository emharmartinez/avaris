name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff, pyright, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.5"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check

      - name: Pyright
        run: uv run pyright

      # Tests never touch the network: recorded responses in tests/fixtures/
      - name: Pytest (unit, integration, e2e)
        run: uv run pytest
